<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Support Pack</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="brand">
        <svg class="icon-logo" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path>
        </svg>
        <span class="title">Support Pack</span>
        <span class="version">v0.1.0</span>
      </div>
      <p class="subtitle">Capture useful browser troubleshooting information.</p>
    </header>

    <div class="privacy-banner">
      <div class="privacy-header">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        <span>Captured information stays on this device.</span>
        <button id="privacy-toggle" class="btn-link" type="button">Details</button>
      </div>
      <div id="privacy-details" class="privacy-details hidden">
        Support Pack does not upload diagnostic information or require an account. Data processing happens 100% locally in your browser.
      </div>
    </div>

    <div id="action-section" class="action-section">
      <button id="capture-btn" class="btn btn-primary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="23 4 23 10 17 10"></polyline>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
        </svg>
        Capture Debug Info
      </button>
    </div>

    <div id="error-box" class="error-box hidden">
      <p id="error-message"></p>
    </div>

    <div id="report-section" class="report-section hidden">
      <div class="report-header">
        <label for="report-text">Report Preview (Editable):</label>
        <div class="report-actions">
          <button id="recapture-btn" class="btn btn-secondary btn-sm" title="Re-capture page info">
            Refresh
          </button>
          <button id="copy-btn" class="btn btn-success btn-sm">
            Copy Report
          </button>
        </div>
      </div>
      <textarea id="report-text" class="report-textarea" rows="14" spellcheck="false"></textarea>
      <div id="copy-toast" class="toast hidden">Copied!</div>
    </div>
  </div>

  <script src="../utils/redact.js"></script>
  <script src="../utils/browser-info.js"></script>
  <script src="../utils/report.js"></script>
  <script src="popup.js"></script>
</body>
</html>
